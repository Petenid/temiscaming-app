# Runs on GitHub's computers every time code is pushed.
# Results: the "Actions" tab of the repository.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the screenshots branch
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generate translations from ARB files
        run: flutter gen-l10n

      # Each problem also becomes an annotation on the run's summary page.
      - name: Check code for problems
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze-output.txt || {
            grep ' • ' analyze-output.txt | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=flutter analyze::${line}"
            done
            exit 1
          }

      # The "github" reporter turns each failing test into an annotation on
      # the run summary page, so failures are readable without the full log.
      - name: Run tests
        run: |
          set -o pipefail
          flutter test --exclude-tags screenshots --reporter github 2>&1 | tee test-output.txt

      # One annotation per failing test, with the error but without the long
      # stack trace, so it fits GitHub's annotation size limit (about 4 KB).
      # If no test failed (say, the code didn't compile), the end of the log.
      - name: Report test failure details
        if: failure()
        shell: python3 {0}
        run: |
          import re
          lines = [l.rstrip("\n") for l in open("test-output.txt", encoding="utf-8", errors="replace")]
          # The github reporter folds each test as "::group::✅ name" … "::endgroup::".
          lines = [l[len("::group::"):] if l.startswith("::group::") else l for l in lines]
          lines = [l for l in lines if not l.startswith("::")]
          noise = re.compile(r"^\s*(#\d+\s|<asynchronous suspension>|\(elided)")
          blocks, current = [], None
          for l in lines:
              if l.startswith(("❌", "✅", "Error:")):
                  if current: blocks.append(current)
                  current = [l] if l.startswith("❌") else None
              elif current is not None and not noise.match(l):
                  current.append(l)
          if current: blocks.append(current)
          def emit(title, body):
              body = body[:3500].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              title = title.replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
              print(f"::error title={title}::{body}")
          for b in blocks:
              name = b[0].split(": ", 1)[-1].replace(" (failed)", "")
              emit(f"Failed: {name}"[:200], "\n".join(b[1:]))
          if not blocks:
              emit("Test output (end)", "\n".join(lines[-60:]))

      - name: Take screenshots
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          flutter test --tags screenshots --update-goldens

      # Replaces the "screenshots" branch with this run's images, so they can
      # be browsed on GitHub (switch branch to "screenshots").
      - name: Publish screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd test/screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" screenshots

  ios:
    name: iOS compile check
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Proves the iPhone app still compiles. No signing, so the result
      # can't be installed; that comes later via TestFlight (spec §10).
      - name: Build iOS app (unsigned)
        run: flutter build ios --no-codesign

  functions:
    name: Backend (functions) build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions

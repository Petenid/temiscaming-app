# Runs on GitHub's computers every time code is pushed.
# Results: the "Actions" tab of the repository.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the screenshots branch
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Generate translations from ARB files
        run: flutter gen-l10n

      - name: Check code for problems
        run: flutter analyze

      # The "github" reporter turns each failing test into an annotation on
      # the run summary page, so failures are readable without the full log.
      - name: Run tests
        run: |
          set -o pipefail
          flutter test --exclude-tags screenshots --reporter github 2>&1 | tee test-output.txt

      - name: Report test failure details
        if: failure()
        run: |
          # Annotations can't contain newlines; GitHub decodes %0A back.
          details=$(grep -v '^::' test-output.txt | tail -n 120 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Test output (last 120 lines)::${details}"

      - name: Take screenshots
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          flutter test --tags screenshots --update-goldens

      # Replaces the "screenshots" branch with this run's images, so they can
      # be browsed on GitHub (switch branch to "screenshots").
      - name: Publish screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd test/screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" screenshots

  ios:
    name: iOS compile check
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Proves the iPhone app still compiles. No signing, so the result
      # can't be installed; that comes later via TestFlight (spec §10).
      - name: Build iOS app (unsigned)
        run: flutter build ios --no-codesign

  functions:
    name: Backend (functions) build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run tests
        run: npx vitest run --reporter=default --reporter=github-actions

# Downloads real pages from the Town's sites and saves them in the repo as
# test "fixtures" (frozen snapshots the parser tests read).
# Run by hand: Actions tab → "Capture fixtures" → Run workflow → pick a source.
# It makes a handful of requests, once — not a scheduled job.
name: Capture fixtures

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to save"
        type: choice
        options: [alerts, calendar, weather, fire, roads]
        default: alerts
      detail_paths:
        description: "alerts only: extra detail pages to save (space-separated paths, e.g. /alertes/2026/10/12/avis-d-ebullition-preventif)"
        required: false
        default: ""
      year:
        description: "calendar only: year to save (all 12 months + January of the next year). Empty = this year."
        required: false
        default: ""

permissions:
  contents: write # to commit the saved pages

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download alert pages
        if: inputs.source == 'alerts'
        env:
          BASE: https://temiscaming.alertesmunicipales.com
          EXTRA: ${{ inputs.detail_paths }}
        run: |
          set -euo pipefail
          day=$(TZ=America/Toronto date +%F)
          out="functions/test/fixtures/$day"
          mkdir -p "$out"
          ua="AlloTemis-fixture-capture/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          get() { # $1 = path, $2 = file name
            curl -sSfL --max-time 30 -A "$ua" "$BASE$1" -o "$out/$2"
            echo "saved $1 → $out/$2 ($(wc -c < "$out/$2") bytes)"
            sleep 2
          }
          get /alertes list-fr.html
          get /alerts list-en.html
          # The current boil-water advisory and its lifting notices (both languages).
          get /alertes/2026/10/12/avis-d-ebullition-preventif detail-fr-boil.html
          get /alerts/2026/10/12/precautionary-boil-water-advisory detail-en-boil.html
          get /alertes/2026/10/19/levee-de-l-avis-d-ebullition-preventif detail-fr-lifted.html
          get /alerts/2026/10/19/precautionary-boil-water-advisory-lifted detail-en-lifted.html
          i=0
          for p in $EXTRA; do i=$((i+1)); get "$p" "extra-$i.html"; done

      # Town events calendar (collection pickups live here), month by month,
      # both languages, plus the MRC's printed collection calendar (PDF).
      - name: Download calendar pages
        if: inputs.source == 'calendar'
        env:
          BASE: https://www.temiscaming.net
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          day=$(TZ=America/Toronto date +%F)
          year=${YEAR:-$(TZ=America/Toronto date +%Y)}
          out="functions/test/fixtures/calendar/$day"
          mkdir -p "$out"
          ua="AlloTemis-fixture-capture/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          get() { # $1 = path, $2 = file name
            curl -sSfL --max-time 30 -A "$ua" "$BASE$1" -o "$out/$2"
            echo "saved $1 → $out/$2 ($(wc -c < "$out/$2") bytes)"
            sleep 2
          }
          month() { # $1 = year, $2 = month number
            local mm; mm=$(printf %02d "$2")
            get "/fr/calendrier?year=$1&month=$2" "fr-$1-$mm.html"
            get "/en/calendar?year=$1&month=$2" "en-$1-$mm.html"
          }
          for m in $(seq 1 12); do month "$year" "$m"; done
          month $((year + 1)) 1
          # MRC de Témiscamingue 2026 collection calendar (research §1).
          get /file-24778 "mrc-calendar.pdf"

      # Weather (Milestone 4, specs/weather.md §2): Environment Canada's city
      # page and alerts, ECCC's forecast-zone polygons around town, and the
      # Open-Meteo forecast for Témiscaming. Saved per capture time, since
      # weather changes: run it again whenever an alert covers the area.
      - name: Download weather data
        if: inputs.source == 'weather'
        env:
          ECCC: https://api.weather.gc.ca/collections
          OPEN_METEO: https://api.open-meteo.com/v1/gem
        run: |
          set -euo pipefail
          stamp=$(TZ=America/Toronto date +%F-%H%M)
          out="functions/test/fixtures/weather/$stamp"
          mkdir -p "$out"
          ua="AlloTemis-fixture-capture/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          get() { # $1 = full URL, $2 = file name
            curl -sSfL --max-time 60 -A "$ua" "$1" -o "$out/$2"
            echo "saved $1 → $out/$2 ($(wc -c < "$out/$2") bytes)"
            sleep 2
          }
          # City page "Témiscamingue": conditions at the Barrage Témiscaming station.
          get "$ECCC/citypageweather-realtime/items/qc-139?f=json" qc-139.json
          # Alerts near town (what the backend will ask for), along the
          # Ontario border (to test that North Bay alerts are left out), and
          # every current Quebec alert (real polygons and texts as samples).
          get "$ECCC/weather-alerts/items?f=json&bbox=-79.20,46.65,-78.95,46.80&limit=100" alerts-town.json
          get "$ECCC/weather-alerts/items?f=json&bbox=-80.60,45.80,-78.60,47.00&limit=200" alerts-border.json
          get "$ECCC/weather-alerts/items?f=json&province=QC&limit=500" alerts-qc.json
          # Forecast zones touching town (Témiscamingue + North Bay) for the
          # point-in-polygon tests.
          get "$ECCC/public-standard-forecast-zones/items?f=json&bbox=-79.20,46.65,-78.95,46.80&limit=20" zones-town.json
          # Open-Meteo forecast for Témiscaming (spec D1).
          daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,rain_sum,snowfall_sum,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset
          get "$OPEN_METEO?latitude=46.7213&longitude=-79.0975&timezone=America%2FToronto&forecast_days=7&daily=$daily" forecast.json

      # Fire bans (Milestone 6, specs/fire-bans.md §2): Quebec's open-fire ban
      # (IFCO) and forest access ban (ICAF) from the ministry's map service.
      # Run it whenever a ban is issued anywhere in Quebec, to save a real one.
      - name: Download fire-ban layers
        if: inputs.source == 'fire'
        env:
          WFS: https://geoegl.msp.gouv.qc.ca/apis/wss/complet.fcgi
        run: |
          set -euo pipefail
          day=$(TZ=America/Toronto date +%F)
          out="functions/test/fixtures/fire/$day"
          mkdir -p "$out"
          ua="AlloTemis-fixture-capture/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          get() { # $1 = layer name, $2 = file name
            curl -sSfL --max-time 60 -A "$ua" "$WFS?service=wfs&version=1.1.0&request=getfeature&typename=$1&outputformat=geojson&srsName=epsg:4326" -o "$out/$2"
            echo "saved $1 → $out/$2 ($(wc -c < "$out/$2") bytes)"
            sleep 2
          }
          get msp_interdiction_feu_ciel_ouvert_ifco ifco.json
          get msp_interdiction_circuler_foret_icaf icaf.json

      # Roads (Milestone 7): Quebec transport ministry (MTMD) layers — road
      # warnings/closures, roadworks, winter road conditions — and the Town's
      # "Info-Travaux" / "Work Info" pages. Each MTMD layer is saved twice:
      # the area request the backend would make (bbox), and the whole province
      # trimmed to a wide box around Témiscaming (in case the bbox request
      # misbehaves, and to keep the files small). Province-wide road warnings
      # are kept whole so we have real "Fermeture" examples from elsewhere.
      - name: Download road data
        if: inputs.source == 'roads'
        env:
          WFS: https://ws.mapserver.transports.gouv.qc.ca/swtq
          TOWN: https://www.temiscaming.net
        run: |
          set -euo pipefail
          day=$(TZ=America/Toronto date +%F)
          out="functions/test/fixtures/roads/$day"
          mkdir -p "$out"
          ua="AlloTemis-fixture-capture/1.0 (+https://github.com/${GITHUB_REPOSITORY})"
          fetch() { # $1 = URL, $2 = file name
            curl -sSfL --max-time 120 -A "$ua" "$1" -o "$out/$2"
            echo "saved $2 ($(wc -c < "$out/$2") bytes)"
            sleep 2
          }
          # Box around the corridor: Témiscaming, Route 101 to Ville-Marie,
          # Highway 63 to North Bay (lat 46.2–47.5, lon -80.0 to -78.5).
          bbox="46.2,-80.0,47.5,-78.5,urn:ogc:def:crs:EPSG::4326"
          for layer in evenements chantiers_mtmdet conditions_routieres; do
            q="service=wfs&version=2.0.0&request=getfeature&typename=ms:$layer&srsname=EPSG:4326&outputformat=geojson"
            fetch "$WFS?$q&bbox=$bbox" "qc-$layer-bbox.json"
            fetch "$WFS?$q" "province.tmp.json"
            python3 - "$out/province.tmp.json" "$out/qc-$layer-area.json" <<'PY'
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          data = json.load(open(src, encoding="utf-8"))
          def pts(g):
              if not g: return
              c = g.get("coordinates")
              def walk(x):
                  if isinstance(x[0], (int, float)): yield x
                  else:
                      for y in x: yield from walk(y)
              if c: yield from walk(c)
          def near(f):
              return any(46.2 <= p[1] <= 47.5 and -80.0 <= p[0] <= -78.5 for p in pts(f.get("geometry")))
          total = len(data.get("features", []))
          data["features"] = [f for f in data.get("features", []) if near(f)]
          json.dump(data, open(dst, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(f"{dst}: {len(data['features'])} of {total} features near Témiscaming")
          PY
            if [ "$layer" = evenements ]; then mv "$out/province.tmp.json" "$out/qc-evenements-province.json"
            else rm "$out/province.tmp.json"; fi
          done
          # The Town's Work Info list (both languages) and two detail pages.
          fetch "$TOWN/fr/info-travaux" town-list-fr.html
          fetch "$TOWN/en/work-info" town-list-en.html
          fetch "$TOWN/fr/info-travaux/1019/rincage-du-reseau-d-aqueduc-mois-d-octobre-" town-detail-fr-1019.html
          fetch "$TOWN/en/work-info/1019/water-system-flushing-month-of-october" town-detail-en-1019.html
          fetch "$TOWN/en/work-info/757/kipawa-road-disruption" town-detail-en-757.html

      - name: Commit
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/test/fixtures
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Fixtures: capture $SOURCE data $(TZ=America/Toronto date +%F)"
          git push

# The project's "manifest": its name, version, and the packages it depends on.
name: community
description: "Independent community information app for Témiscaming, Quebec."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter's own translations for built-in widgets (back button tooltip, etc.).
  flutter_localizations:
    sdk: flutter
  # Date/number formatting; required by the generated localization code.
  intl: any
  # Saves the language and sector choices on the device.
  shared_preferences: ^2.5.3
  # Connects the app to the Firebase project (lib/firebase_options.dart).
  firebase_core: ^5.0.0
  # Reads town alerts from the Firestore database (keeps an offline copy).
  cloud_firestore: ^7.0.0
  # Push notifications for water advisories (iPhone and Android).
  firebase_messaging: ^17.0.0
  # Evening-before bin reminders, scheduled on the phone (works offline).
  flutter_local_notifications: ^22.3.0
  # Time zones, so reminders fire at 7 p.m. Témiscaming time.
  timezone: ^0.11.0
  # Opens the Town's web pages in the browser.
  url_launcher: ^6.3.3
  # "Add to my calendar": opens the phone's own calendar app pre-filled, and
  # the user confirms there (events spec D6). Android and iOS only.
  add_2_calendar: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Recommended code-style checks, run by `flutter analyze`.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Turns lib/l10n/*.arb into Dart code (lib/l10n/app_localizations*.dart).
  generate: true
